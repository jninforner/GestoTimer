<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#303f91">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1.6.0">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1.6.0">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1.6.0">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>GestoTimer</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
<style>
/* Colors de totes les apps Gesto, en mode clar i fosc (ESTIL.md, «Colors i tipografia»).
   Font única: si canvies un color aquí, canvia a totes les apps. */
:root{color-scheme:light;--bg:#f7f8fd;--tx:#28377e;--mu:#566598;--ln:#303f91;--surface:#fff;--soft:#f0f2fc;--border:#d4daf1;--field:#b6bfdf;--on:#fff;--red:#b42318;--green:#17734a}
:root[data-theme=dark]{color-scheme:dark;--bg:#10152c;--tx:#e5e9ff;--mu:#adb8e5;--ln:#a1afff;--surface:#1b2447;--soft:#232f59;--border:#425080;--field:#6371a0;--on:#10152c;--red:#ff9992;--green:#84dbab}
:root{--main-bg:#eaf0ff;--main-border:#afbfeb}
:root[data-theme=dark]{--main-bg:#202e55;--main-border:#516798}

/* Estil de base de les apps Gesto (ESTIL.md): tipografia, targetes, camps, botons, llistes, fitxes, inici de sessió.
   El fan servir GestoCatalog, GestoTips i GestoAdmin. Va després de colors.css i abans de l'estil propi de cada app. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 36px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:18px}
h1{font-size:28px;letter-spacing:-.035em;margin:0}
h2{font-size:21px;margin:0 0 14px}
h3{font-size:17px;margin:0 0 8px}
p{margin:8px 0}
nav,.actions{display:flex;gap:8px;flex-wrap:wrap}
nav{margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 3px 14px rgba(40,55,126,.055);padding:20px;margin-bottom:16px}
label{display:grid;gap:4px;font-size:14px;color:var(--mu)}
input,select,textarea{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--tx);font:inherit;font-size:16px}
textarea{display:block;resize:vertical;margin:10px 0}
button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 15px;border:1px solid var(--ln);border-radius:10px;background:var(--surface);color:var(--tx);font:600 15px/1.3 inherit;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
button:hover,.button:hover{background:var(--soft)}
.primary,[aria-current=page]{background:var(--ln);color:var(--on)}
.primary:hover,[aria-current=page]:hover{background:var(--ln);filter:brightness(1.13)}
:focus-visible{outline:3px solid #788cf0;outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item{border-top:1px solid var(--border);padding:8px 0}
.item:last-child{padding-bottom:0}
.meta{color:var(--mu);font-size:14px}
.error,.remove{color:var(--red)}
@media(max-width:430px){main{padding:14px 12px 28px}.card{padding:15px}h1{font-size:24px}nav button{padding:8px 11px}}
[hidden]{display:none !important}
main{width:100%;padding-inline:max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-right))}
.card,.grid,.grid>* ,label,.row>*{min-width:0}
input,select,textarea,button,.button{max-width:100%;min-width:0}
input[type=file]{width:100%}
img,video,canvas{max-width:100%;height:auto}
.card{overflow-wrap:anywhere}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
#login-panel{max-width:500px;margin-inline:auto}
#login-form .grid{grid-template-columns:minmax(0,1fr)}
.login-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#password-reset{display:inline-block;margin:12px 0;color:var(--tx);text-underline-offset:.18em}
#login-status:empty{display:none}
@media(max-width:480px){
  html{-webkit-text-size-adjust:100%}
  button,.button{touch-action:manipulation}
}
/* Requadre principal de cada pantalla */
.main-card{background:var(--main-bg);border-color:var(--main-border)}
.main-card .card{background:var(--surface);box-shadow:none;border-radius:14px;padding:16px;margin:12px 0 0}
.main-card .card h3:first-child{margin-top:0}
.main-card .card h2{font-size:17px;margin:0 0 10px}
.main-card>.card:first-of-type{margin-top:14px}
/* Fitxes (diàlegs): <dialog class="sheet-dialog"> amb .sheet-head (títol i ✕), .sheet-part i .sheet-foot */
dialog.sheet-dialog{width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);padding:18px;color:var(--tx);background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:auto}
dialog.sheet-dialog::backdrop{background:#11183180}
.sheet-close{min-width:0;width:40px;min-height:40px;padding:0;font-size:18px;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{margin:0}
.sheet-part{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
.sheet-part h3{margin:0 0 8px}
.sheet-foot{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
/* Botons d'icona (llapis, impressora…) */
.icon-button{min-width:0;width:36px;min-height:36px;padding:0}
.icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-button.remove{border-color:var(--red)}
.icon-button:disabled{opacity:.35}

/* ===== GestoTimer: només el que és propi. Colors, tipografia, botons, camps i targetes són de
   shared/colors.css i shared/base.css (comuns amb les altres apps Gesto). ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{-webkit-tap-highlight-color:transparent}
/* Colors propis (alarma) i noms antics que apunten als comuns */
:root{--red-soft:#fff0ed;--red-border:#f0c4bf;--navi:var(--ln);--navi-fosc:var(--tx);--pale:var(--soft);--fons:var(--bg);--vermell:var(--red);--pale-v:var(--red-soft);--linia:var(--border)}
:root[data-theme=dark]{--red-soft:#3a1f2e;--red-border:#7a3b48}
/* GestoTimer no té <main>: el cos fa de contenidor, amb les mateixes mides que el <main> de les altres apps */
body{max-width:760px;margin:0 auto;padding:20px 16px 36px;min-height:100dvh}
@media(max-width:430px){body{padding:14px 12px 28px}}
/* Requadre principal: títol, + i − */
.cap-timers{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cap-timers h2{margin:0}
.controls-timers{display:flex;align-items:center;gap:7px}
.controls-timers button{min-width:0;width:40px;min-height:40px;height:40px;padding:0;font-size:24px;line-height:1}
.comptador{font-size:13px;color:var(--mu);font-weight:650;min-width:42px;text-align:center}
.timers{display:grid;gap:10px;margin-top:12px}
/* Cada temporitzador */
.t{min-height:116px;background:var(--surface);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;gap:10px;padding:10px 13px;min-width:0}
.t.fi{background:var(--red-soft);border-color:var(--red-border);color:var(--red);animation:parpelleig 1s infinite}
@keyframes parpelleig{50%{opacity:.68}}
.zona{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.baix{display:flex;align-items:center;gap:7px}
.ajust{display:flex;gap:5px}
.temps{font-size:clamp(27px,8.6vw,70px);font-variant-numeric:tabular-nums lining-nums;font-weight:680;letter-spacing:-.055em;flex:1;min-width:0;text-align:center;white-space:nowrap;color:var(--tx)}
.t.fi .temps{color:var(--red)}
select{min-height:44px;height:44px;padding:6px 10px;font-weight:600;text-overflow:ellipsis}
/* Botons: els principals (Inicia, Desa) van plens; .sec són secundaris; .mini, els − i + del temps */
.botons{display:flex;flex-direction:column;gap:7px}
.botons button{min-width:clamp(76px,20vw,100px);padding:9px 8px}
.botons button:not(.sec),.controls-timers button:not(.sec),.pan .desa{background:var(--ln);color:var(--on)}
.botons button:not(.sec):hover,.controls-timers button:not(.sec):hover,.pan .desa:hover{background:var(--ln);filter:brightness(1.13)}
button.mini{min-width:0;width:clamp(36px,9vw,44px);min-height:0;height:clamp(36px,9vw,44px);padding:0;background:var(--soft);color:var(--ln);border-color:var(--field);font-size:clamp(20px,5vw,25px);font-weight:500;line-height:1;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button.mini:hover{background:var(--main-bg)}
button:active{transform:scale(.97)}
.t.fi button:not(.sec):not(.mini){border-color:var(--red);background:var(--red);color:var(--on)}
.t.fi button.sec,.t.fi button.mini{color:var(--red);background:var(--surface);border-color:var(--red-border)}
/* Configura opcions: finestra amb el mateix aspecte que les fitxes de les altres apps */
.vel{position:fixed;inset:0;background:#11183180;display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
.vel.obert{display:flex}
.pan{background:var(--surface);color:var(--tx);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:560px;max-height:100%;overflow:auto}
.pan h2{margin:0 0 4px}
.fp{display:block;padding:10px 0 12px;border-bottom:1px solid var(--border);margin:0}
.fp .fila-cap{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.pan .nm{flex:1;min-width:0;font-weight:650}
.pan .elim{min-width:0;width:40px;min-height:40px;height:40px;padding:0;font-size:21px;line-height:1;flex-shrink:0}
.temps-config{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;margin-top:5px}
.temps-config label{display:block}
.camp-temps{display:flex;align-items:center;justify-content:center;border:1px solid var(--field);border-radius:10px;padding:1px 5px;background:var(--surface);min-width:100px}
.pan .camp-temps input{width:34px;min-width:0;min-height:0;height:auto;border:0;background:transparent;padding:4px 1px;font-size:17px;text-align:center;font-variant-numeric:tabular-nums;outline:none}
.camp-temps span{font-size:17px}
.nota-avís{font-size:12px;color:var(--mu);margin-top:8px}
.pan .afegeix{width:100%;margin-top:12px}
.peu{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
@media(max-width:380px){.t{padding:7px 8px;gap:6px}.zona{gap:5px}.baix{gap:4px}.ajust{gap:3px}.botons{gap:5px}.botons button{padding:7px 5px;min-width:66px}}
/* Capçalera comuna de les apps Gesto: nom, versió, ☰ Menú i ↪︎ Sortir (ESTIL.md, «Capçalera de l'app» i «Menú»).
   Font única: si canvies alguna cosa aquí, canvia a totes les apps. Va després del CSS de cada app. */
.topbar{display:flex;align-items:center;justify-content:space-between;position:relative;gap:12px;margin:0 0 18px;padding:0 0 10px;border:0}
.topbar .brand{min-width:0;flex:1}
.topbar .brand h1{margin:0;font-size:clamp(20px,4.5vw,30px);font-weight:700;letter-spacing:-.035em;line-height:1.1;overflow-wrap:anywhere;font-variant:normal}
.topbar .version{margin-top:5px;font-size:14px;color:var(--mu)}
.top-actions{display:flex;flex-shrink:0;gap:8px;align-items:center}
.top-actions>button,.top-actions>.menu-anchor>button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--surface);color:var(--tx);font:600 15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant:normal;white-space:nowrap;cursor:pointer;box-shadow:none}
.top-actions>button:hover,.top-actions>.menu-anchor>button:hover{background:var(--soft);color:var(--tx);box-shadow:none;filter:none}
.top-actions button span:first-child{font-size:18px;line-height:1}
.top-actions [hidden]{display:none!important}
.menu-anchor{position:relative}
#menu-panel{position:absolute;top:calc(100% + 8px);right:0;z-index:30;display:block;width:max-content;min-width:200px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 30px rgba(40,55,126,.15);padding:10px}
#menu-panel[hidden]{display:none}
#menu-panel #tabs{display:grid;gap:6px;margin:0 0 6px}
#menu-panel #tabs:empty{display:none}
#menu-panel button{display:flex;align-items:center;justify-content:flex-start;width:100%;min-height:44px;margin:0;padding:9px 15px;border:1px solid var(--ln);border-radius:10px;background:var(--surface);color:var(--tx);font:600 15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant:normal;text-align:left;white-space:nowrap;cursor:pointer;box-shadow:none}
#menu-panel button:hover{background:var(--soft);color:var(--tx);box-shadow:none;filter:none}
#menu-panel button[aria-current=page],#menu-panel button.on{background:var(--ln);color:var(--on)}
#menu-panel button[aria-current=page]:hover,#menu-panel button.on:hover{background:var(--ln);color:var(--on);filter:brightness(1.13)}
@media(max-width:430px){
  .top-actions>button,.top-actions>.menu-anchor>button{font-size:14px;padding:7px 9px}
  .topbar .version{font-size:13px}
}
/* Mòbil: només les icones, sense vora ni fons; el menú s'ancora a la capçalera. */
@media(max-width:480px){
  .topbar{align-items:flex-start;gap:8px;margin-bottom:8px;padding-bottom:4px}
  .top-actions{gap:4px}
  .top-actions #menu-toggle,.top-actions #logout{width:44px;min-height:44px;padding:0;border-color:transparent;background:transparent}
  .top-actions .top-action-label{display:none}
  .menu-anchor{position:static}
  #menu-panel{top:100%;right:0}
}
.topbar .entorn-proves{color:var(--red);letter-spacing:.04em}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><h1>GestoTimer</h1><div class="meta version">Versió 1.6.0<span id="sync-state" role="status"></span></div></div>
  <div class="top-actions">
    <div class="menu-anchor">
      <button id="menu-toggle" type="button" aria-label="Menú" aria-expanded="false" aria-controls="menu-panel"><span aria-hidden="true">☰</span><span class="top-action-label" aria-hidden="true">Menú</span></button>
      <div id="menu-panel" hidden>
        <nav aria-label="Seccions" id="tabs"><button id="cfg" type="button">Configura opcions</button></nav>
        <button id="theme" type="button" aria-pressed="false">Mode fosc</button>
      </div>
    </div>
    
  </div>
</header>

<script>
// Capçalera comuna de les apps Gesto: menú ☰ i mode fosc (ESTIL.md, «Capçalera de l'app» i «Menú»).
// Font única per a GestoCatalog, GestoTips, GestoAdmin i GestoStock. L'HTML el genera shared/header.mjs.
// gestoHeader() es pot cridar diverses vegades: només prepara els botons la primera.
function gestoHeader() {
  if (gestoHeader.ready) return gestoHeader.ready;
  const toggle = document.getElementById('menu-toggle');
  const panel = document.getElementById('menu-panel');
  const theme = document.getElementById('theme');
  function setMenu(open) {
    panel.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
  }
  toggle.addEventListener('click', event => {
    event.stopPropagation();
    setMenu(panel.hidden);
  });
  // Es tanca en tocar fora, amb Esc o en triar una secció.
  document.addEventListener('click', event => {
    if (!panel.hidden && !event.target.closest('.menu-anchor')) setMenu(false);
  });
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape' || panel.hidden) return;
    setMenu(false);
    toggle.focus();
  });
  panel.addEventListener('click', event => {
    if (event.target.closest('#tabs button')) setMenu(false);
  });
  // Mode fosc: clau `theme` del navegador, comuna a totes les apps (mateix domini).
  // El <head> ja l'aplica abans de pintar la pàgina; aquí només s'actualitza el botó.
  function setTheme(dark) {
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    theme.textContent = dark ? 'Mode clar' : 'Mode fosc';
    theme.setAttribute('aria-pressed', String(dark));
  }
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch {}
  setTheme(saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
  theme.addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme !== 'dark';
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch {}
    setTheme(dark);
  });
  gestoHeader.ready = {
    setMenu,
    setTheme,
    showMenu() { toggle.hidden = false; },
    tabs: document.getElementById('tabs')
  };
  return gestoHeader.ready;
}

const MIN_TIMERS = 1, MAX_TIMERS = 10;
let timerCount = Math.min(MAX_TIMERS, Math.max(MIN_TIMERS, Number(carrega('nombreTemporitzadors', 3)) || 3));
/* El pas de + i − creix mentre es manté premut */
let so = null;
function llegirAudio() { try { so = so || new (window.AudioContext || window.webkitAudioContext)(); so.resume(); } catch (e) {} }
function piuIntermedi(tipus) {
  try {
    if (!so) return;
    Array.from({length: 8}, (_, i) => i * 0.25).forEach(function (offset) {
      const o = so.createOscillator(), g = so.createGain();
      o.connect(g); g.connect(so.destination);
      o.frequency.value = tipus === 2 ? 1100 : 550; g.gain.value = 0.22;
      o.start(so.currentTime + offset); o.stop(so.currentTime + offset + 0.17);
    });
  } catch (e) {}
}
function piu() {
  try {
    const o = so.createOscillator(), g = so.createGain();
    o.connect(g); g.connect(so.destination);
    o.frequency.value = 880; g.gain.value = 0.3;
    o.start(); o.stop(so.currentTime + 0.4);
  } catch (e) {}
}
function guarda(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function carrega(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function fmt(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const p = n => String(n).padStart(2, '0');
  return (h ? h + ':' : '') + p(m) + ':' + p(x);
}

/* Opcions: noms amb temps; se'n poden afegir i eliminar */
let ops = carrega('ops', null);
if (!Array.isArray(ops)) {
  ops = [{ id: 0, n: 'Opció A', m: 5, s: 0, am: 0, as: 0, bm: 0, bs: 0 }];
}
if (ops.length === 0) ops = [{ id: 0, n: 'Opció A', m: 5, s: 0, am: 0, as: 0, bm: 0, bs: 0 }];
ops.forEach(function (o, k) { if (typeof o.id !== 'number') o.id = k; });
let segId = carrega('segId', null);
const maxId = ops.reduce(function (m, o) { return Math.max(m, o.id); }, -1);
if (segId === null || segId <= maxId) segId = maxId + 1;
function nouId() { const x = segId++; guarda('segId', segId); return x; }

const selectes = [];
function omple(sel, v) {
  if (isNaN(v)) v = -1;
  sel.innerHTML = '';
  const ph = document.createElement('option');
  ph.value = '-1'; ph.textContent = 'Tria opció';
  sel.appendChild(ph);
  ops.forEach(function (o) {
    const op = document.createElement('option');
    op.value = String(o.id);
    op.textContent = (o.id === v) ? o.n : o.n + ' (' + fmt(o.m * 60 + o.s) + ')';
    sel.appendChild(op);
  });
  sel.value = String(v);
  if (sel.value !== String(v)) sel.value = '-1';
}
function refrescaSelectes() { selectes.forEach(function (sel) { omple(sel, parseInt(sel.value)); }); }

/* Capçalera, menú ☰ i mode fosc: shared/header.js, comú a totes les apps Gesto. «Configura opcions» és una opció del menú. */
gestoHeader();
const cfg = document.getElementById('cfg');
/* Requadre principal amb els temporitzadors. */
const principal = document.createElement('section');
principal.className = 'card main-card';
const capTimers = document.createElement('div');
capTimers.className = 'cap-timers';
const titTimers = document.createElement('h2');
titTimers.textContent = 'Temporitzadors';
capTimers.appendChild(titTimers);
const llistaTimers = document.createElement('div');
llistaTimers.className = 'timers';
principal.append(capTimers, llistaTimers);
document.body.appendChild(principal);

const vel = document.createElement('div');
vel.className = 'vel';
const pan = document.createElement('div');
pan.className = 'pan';
pan.innerHTML = '<h2>Opcions</h2><div class="llista"></div><button class="sec afegeix">Afegeix opció</button><div class="peu"><button class="sec cancela">Cancel·la</button><button class="desa">Desa</button></div>';
vel.appendChild(pan);
document.body.appendChild(vel);
const llista = pan.querySelector('.llista');
let files = [];
function campTemps(segons) {
  const caixa = document.createElement('div'); caixa.className = 'camp-temps';
  const min = document.createElement('input'); min.type='text'; min.inputMode='numeric'; min.maxLength=3; min.setAttribute('aria-label','Minuts');
  const sep = document.createElement('span'); sep.textContent=':';
  const sec = document.createElement('input'); sec.type='text'; sec.inputMode='numeric'; sec.maxLength=2; sec.setAttribute('aria-label','Segons');
  min.value=String(Math.floor(segons/60)).padStart(2,'0'); sec.value=String(segons%60).padStart(2,'0');
  // Dos dígits de minuts fan avançar automàticament als segons.
  min.addEventListener('focus',function(){min.select();});
  sec.addEventListener('focus',function(){sec.select();});
  min.addEventListener('input',function(){
    min.value=min.value.replace(/\D/g,'').slice(0,3);
    if(min.value.length>=2 && Number(min.value)<=99){sec.focus();}
  });
  sec.addEventListener('input',function(){sec.value=sec.value.replace(/\D/g,'').slice(0,2);});
  min.addEventListener('blur',function(){min.value=String(Math.min(999,Number(min.value)||0)).padStart(2,'0');});
  sec.addEventListener('blur',function(){sec.value=String(Math.min(59,Number(sec.value)||0)).padStart(2,'0');});
  caixa.append(min,sep,sec);
  return {caixa,min,sec, valor:function(){return Math.min(999,Number(min.value)||0)*60+Math.min(59,Number(sec.value)||0);}};
}
function afegeixFila(o) {
  const f=document.createElement('div'); f.className='fp';
  const cap=document.createElement('div'); cap.className='fila-cap';
  const nm=document.createElement('input'); nm.type='text'; nm.className='nm'; nm.maxLength=24; nm.placeholder='Nom de l’opció'; nm.value=o.n;
  const del=document.createElement('button'); del.className='sec elim'; del.textContent='×'; del.setAttribute('aria-label','Elimina l’opció');
  cap.append(nm,del); f.appendChild(cap);
  function linia(nom,valor){
    const r=document.createElement('div'); r.className='temps-config';
    const label=document.createElement('label'); label.textContent=nom;
    const camp=campTemps(valor); r.append(label,camp.caixa); f.appendChild(r); return camp;
  }
  const durada=linia('Temps total',Number(o.m||0)*60+Number(o.s||0));
  const avis1=linia('1r avís',Number(o.am||0)*60+Number(o.as||0));
  const avis2=linia('2n avís',Number(o.bm||0)*60+Number(o.bs||0));
  const fila={id:o.id,nm,durada,avis1,avis2,del};
  del.onclick=function(){if(files.length<=1)return;f.remove();files=files.filter(x=>x!==fila);actualitzaEliminacio();};
  llista.appendChild(f); files.push(fila); actualitzaEliminacio(); return fila;
}
function actualitzaEliminacio() {
  files.forEach(function(f){f.del.disabled=files.length<=1;f.del.style.opacity=files.length<=1?'0.25':'1';f.del.setAttribute('aria-label',files.length<=1?'No es pot eliminar l’única opció':'Elimina l’opció');});
}
function obre() {
  llista.innerHTML = '';
  files = [];
  ops.forEach(afegeixFila);
  actualitzaEliminacio();
  vel.classList.add('obert');
}
function tanca() { vel.classList.remove('obert'); }
cfg.onclick = obre;
pan.querySelector('.afegeix').onclick = function () {
  const fila = afegeixFila({ id: nouId(), n: '', m: 1, s: 0 });
  fila.nm.focus();
};
pan.querySelector('.cancela').onclick = tanca;
vel.onclick = function (e) { if (e.target === vel) tanca(); };
pan.querySelector('.desa').onclick = function () {
  if (files.length === 0) return;
  ops = files.map(function (f, k) {
    const t=f.durada.valor(), a=f.avis1.valor(), b=f.avis2.valor();
    return {id:f.id,n:f.nm.value.trim()||('Opció '+(k+1)),
      m:Math.floor(t/60),s:t%60,am:Math.floor(a/60),as:a%60,bm:Math.floor(b/60),bs:b%60};
  });
  guarda('ops', ops);
  refrescaSelectes();
  document.dispatchEvent(new Event('opcionsActualitzades'));
  tanca();
};

/* Temporitzadors dinàmics: entre 1 i 10. */
const controls = document.createElement('div');
controls.className = 'controls-timers';
const menysTimer = document.createElement('button');
menysTimer.className = 'sec'; menysTimer.textContent = '−'; menysTimer.title = 'Elimina l’últim temporitzador'; menysTimer.setAttribute('aria-label','Elimina l’últim temporitzador');
const comptador = document.createElement('span'); comptador.className = 'comptador';
const mesTimer = document.createElement('button');
mesTimer.textContent = '+'; mesTimer.title = 'Afegeix un temporitzador'; mesTimer.setAttribute('aria-label','Afegeix un temporitzador');
controls.append(menysTimer, comptador, mesTimer);
capTimers.appendChild(controls);
const timersActius = [];
function actualitzaControls() {
  comptador.textContent = timersActius.length + '/10';
  menysTimer.disabled = timersActius.length <= MIN_TIMERS;
  mesTimer.disabled = timersActius.length >= MAX_TIMERS;
  guarda('nombreTemporitzadors', timersActius.length);
}
function creaTemporitzador(i) {
  let total = carrega('u' + i, null);
  if (total === null) { const g = carrega('t' + i, { m: 5, s: 0 }); total = g.m * 60 + g.s; }
  let resta = total, fins = null, id = null, al = null;
  let avisSeg = [0,0];
  let avisFet = [false,false];
  const d = document.createElement('div');
  d.className = 't';
  d.innerHTML =
    
    '<div class="zona"><select class="op"></select><div class="baix"><div class="ajust"><button class="mini men" aria-label="Baixa el temps">−</button><button class="mini mes" aria-label="Puja el temps">+</button></div><div class="temps">' + fmt(total) + '</div></div></div>' +
    '<div class="botons"><button class="go">Inicia</button><button class="sec rs">Reinicia</button></div>';
  llistaTimers.appendChild(d);
  const pant = d.querySelector('.temps'), go = d.querySelector('.go'), rs = d.querySelector('.rs');
  const sel = d.querySelector('.op');
  selectes.push(sel);
  let q = carrega('q' + i, null);
  if (q === null) q = carrega('p' + i, -1);
  omple(sel, q);
  function actualitzaAvis() { const o = ops.find(function (x) { return x.id === parseInt(sel.value); }); avisSeg = o ? [Number(o.am||0)*60+Number(o.as||0),Number(o.bm||0)*60+Number(o.bs||0)] : [0,0]; }
  actualitzaAvis();
  const onOpcionsActualitzades = function () { actualitzaAvis(); if (!id) avisFet = [false,false]; };
  document.addEventListener('opcionsActualitzades', onOpcionsActualitzades);
  function pinta() { pant.textContent = fmt(resta); }
  function atura() { clearInterval(id); id = null; fins = null; go.textContent = 'Inicia'; }
  function paraAlarma() { clearInterval(al); al = null; d.classList.remove('fi'); }
  function tic() {
    resta = Math.max(0, Math.ceil((fins - Date.now()) / 1000));
    pinta();
    avisSeg.forEach(function(seg,j){
      if (!avisFet[j] && seg>0 && total>seg && total-resta>=seg && resta>0) {
        avisFet[j]=true; piuIntermedi(j + 1);
      }
    });
    if (resta === 0) { atura(); d.classList.add('fi'); go.textContent = 'Atura'; piu(); clearInterval(al); al = setInterval(piu, 700); }
  }
  function ajusta(delta) {
    if (al) { paraAlarma(); go.textContent = 'Inicia'; }
    if (id) {
      fins = Math.max(Date.now() + 1000, fins + delta * 1000);
      resta = Math.max(1, Math.ceil((fins - Date.now()) / 1000));
      pinta();
      return;
    }
    if (resta === 0) { resta = total; avisFet = [false,false]; }
    resta = Math.min(86400, Math.max(0, resta + delta));
    if (go.textContent === 'Inicia') { total = resta; guarda('u' + i, total); }
    pinta();
  }
  function repeteix(boto, signe) {
    let t1 = null, t2 = null, n = 0;
    function para() { clearTimeout(t1); clearInterval(t2); }
    function pas() { return n < 8 ? 5 : (n < 20 ? 30 : 60); }
    boto.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      para(); n = 0;
      ajusta(signe * pas());
      t1 = setTimeout(function () { t2 = setInterval(function () { n++; ajusta(signe * pas()); }, 120); }, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { boto.addEventListener(ev, para); });
  }
  repeteix(d.querySelector('.men'), -1);
  repeteix(d.querySelector('.mes'), 1);
  go.onclick = function () {
    llegirAudio();
    if (al) { paraAlarma(); go.textContent = 'Inicia'; return; }
    d.classList.remove('fi');
    if (id) { atura(); go.textContent = 'Continua'; return; }
    if (resta === 0) { resta = total; avisFet = [false,false]; pinta(); }
    if (resta === 0) return;
    fins = Date.now() + resta * 1000;
    id = setInterval(tic, 250);
    go.textContent = 'Pausa';
  };
  rs.onclick = function () { paraAlarma(); atura(); resta = total; avisFet = [false,false]; pinta(); };
  sel.onchange = function () {
    const k = parseInt(sel.value);
    guarda('q' + i, k);
    omple(sel, k);
    const o = ops.find(function (x) { return x.id === k; });
    if (!o) return;
    paraAlarma(); atura();
    total = resta = o.m * 60 + o.s;
    avisFet = [false,false];
    actualitzaAvis();
    guarda('u' + i, total);
    pinta();
  };
  timersActius.push({ element: d, destrueix: function () {
    clearInterval(id); clearInterval(al);
    document.removeEventListener('opcionsActualitzades', onOpcionsActualitzades);
    const pos = selectes.indexOf(sel); if (pos !== -1) selectes.splice(pos, 1);
    d.remove();
  }});
}
menysTimer.onclick = function () {
  if (timersActius.length <= MIN_TIMERS) return;
  const ultim = timersActius.pop();
  ultim.destrueix();
  actualitzaControls();
};
mesTimer.onclick = function () {
  if (timersActius.length >= MAX_TIMERS) return;
  creaTemporitzador(timersActius.length);
  actualitzaControls();
};
for (let i = 0; i < timerCount; i++) creaTemporitzador(i);
actualitzaControls();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
