<!DOCTYPE html>
<html lang="ca">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14518a">
<link rel="apple-touch-icon" href="icon-192.png">




<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Temporitzadors">
<title>Temporitzadors</title>
<style>
:root{--navi:#14518a;--navi-fosc:#103b63;--pale:#e8f0f7;--fons:#f3f6f9;--vermell:#bd443f;--pale-v:#fff0ed;--linia:#dbe5ed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--fons);color:#203448;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-variant:normal}
button,select,input{font-family:inherit;font-variant:normal}
body{display:grid;grid-template-rows:auto repeat(6,minmax(0,1fr));gap:10px;padding:12px;min-height:100dvh}
.cap{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:3px 3px 7px;flex-wrap:wrap}
.cap h1{margin:0;font-size:clamp(21px,5vw,29px);font-weight:750;letter-spacing:-.035em;color:var(--navi-fosc)}
.versio{font-size:12px;font-weight:600;color:#7c8c9c;white-space:nowrap;margin-right:auto}
.t{background:#fff;border:1px solid var(--linia);border-left:4px solid var(--navi);border-radius:14px;box-shadow:0 3px 12px rgba(21,60,90,.055);display:flex;align-items:center;gap:10px;padding:10px 13px;min-width:0}
.t.fi{background:var(--pale-v);border-color:#e8c1bd;border-left-color:var(--vermell);color:var(--vermell);animation:parpelleig 1s infinite}
@keyframes parpelleig{50%{opacity:.68}}
.zona{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.baix{display:flex;align-items:center;gap:7px}
.ajust{display:flex;gap:5px}
.temps{font-size:clamp(27px,8.6vw,70px);font-variant-numeric:tabular-nums lining-nums;font-weight:680;letter-spacing:-.055em;flex:1;min-width:0;text-align:center;white-space:nowrap;color:var(--navi-fosc)}
.botons{display:flex;flex-direction:column;gap:7px}
.botons button{font-size:clamp(12px,3.3vw,16px);padding:9px 8px;min-width:clamp(66px,18vw,100px)}
button{border:1px solid var(--navi);border-radius:9px;background:var(--navi);color:white;font-weight:650;letter-spacing:0;font-size:clamp(13px,3.5vw,17px);padding:10px 12px;min-width:clamp(76px,21vw,108px);cursor:pointer;transition:background .16s,border-color .16s,transform .12s}
button:hover{background:var(--navi-fosc);border-color:var(--navi-fosc)}
button:active{transform:scale(.97)}
button.sec{background:#fff;color:var(--navi);border-color:#b9cede}
button.sec:hover{background:var(--pale)}
button.mini{min-width:0;width:clamp(32px,8.4vw,41px);height:clamp(32px,8.4vw,41px);padding:0;border-radius:9px;background:var(--pale);color:var(--navi);border:1px solid #c8d9e8;font-size:clamp(20px,5vw,25px);font-weight:500;line-height:1;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button.mini:hover{background:#d8e8f5}
select{font-size:clamp(13px,3.6vw,18px);font-weight:600;padding:7px 9px;border-radius:9px;border:1px solid #c9d9e6;background:#f8fafc;color:var(--navi-fosc);width:100%;max-width:100%;text-overflow:ellipsis}
.t.fi .temps{color:var(--vermell)}
.t.fi button:not(.sec){border-color:var(--vermell);background:var(--vermell)}
.t.fi button.sec{color:var(--vermell);border-color:#e4bbb7;background:#fff}
.t.fi button.mini{color:var(--vermell);background:#fff}
.vel{position:fixed;inset:0;background:rgba(11,34,54,.58);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.vel.obert{display:flex}
.pan{background:#fff;color:#203448;border:1px solid var(--linia);border-radius:16px;box-shadow:0 18px 50px rgba(0,20,50,.2);padding:17px;width:100%;max-width:560px;max-height:100%;overflow:auto}
.pan h2{margin:0 0 12px;font-size:22px;font-weight:750;text-align:left;letter-spacing:-.02em;color:var(--navi-fosc)}
.fp{display:block;padding:10px 0 12px;border-bottom:1px solid var(--linia);margin:0}
.fp .fila-cap{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.pan input{font-size:18px;padding:8px;border-radius:8px;border:1px solid #c7d8e6;background:#fff;color:#203448;text-align:center}
.pan .nm{flex:1;min-width:0;text-align:left;font-size:17px;font-weight:650;padding:8px 10px}
.pan .elim{min-width:0;width:34px;height:34px;padding:0;border-radius:9px;font-size:21px;line-height:1;flex-shrink:0}
.temps-config{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;margin-top:5px}
.temps-config label{font-size:14px;color:#4c6072}
.camp-temps{display:flex;align-items:center;justify-content:center;border:1px solid #c7d8e6;border-radius:8px;padding:1px 5px;background:#f8fafc;min-width:100px}
.pan .camp-temps input{width:34px;min-width:0;border:0;background:transparent;padding:4px 1px;font-size:17px;font-variant-numeric:tabular-nums;outline:none}
.camp-temps span{font-size:17px}
.nota-avís{font-size:12px;opacity:.8;margin-top:8px}
.pan .afegeix{width:100%;margin-top:12px}
.peu{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
@media(min-width:800px){body{max-width:1080px;margin:0 auto;padding:20px;gap:12px}.t{padding:14px 24px}.cap{padding-bottom:12px}}
@media(max-width:380px){body{gap:7px;padding:8px}.t{padding:7px 8px;gap:6px}.zona{gap:5px}.baix{gap:4px}.ajust{gap:3px}.botons{gap:5px}.botons button{padding:7px 5px}}
</style>
</head>
<body>
<script>
const APP_VERSION = '1.2.0';
const N = 6;
/* El pas de + i − creix mentre es manté premut */
let so = null;
function llegirAudio() { try { so = so || new (window.AudioContext || window.webkitAudioContext)(); so.resume(); } catch (e) {} }
function piuIntermedi(tipus) {
  try {
    if (!so) return;
    Array.from({length: 8}, (_, i) => i * 0.25).forEach(function (offset) {
      const o = so.createOscillator(), g = so.createGain();
      o.connect(g); g.connect(so.destination);
      o.frequency.value = tipus === 2 ? 1100 : 550; g.gain.value = 0.22;
      o.start(so.currentTime + offset); o.stop(so.currentTime + offset + 0.17);
    });
  } catch (e) {}
}
function piu() {
  try {
    const o = so.createOscillator(), g = so.createGain();
    o.connect(g); g.connect(so.destination);
    o.frequency.value = 880; g.gain.value = 0.3;
    o.start(); o.stop(so.currentTime + 0.4);
  } catch (e) {}
}
function guarda(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function carrega(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function fmt(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const p = n => String(n).padStart(2, '0');
  return (h ? h + ':' : '') + p(m) + ':' + p(x);
}

/* Opcions: noms amb temps; se'n poden afegir i eliminar */
let ops = carrega('ops', null);
if (!Array.isArray(ops)) {
  ops = [{ id: 0, n: 'Opció A', m: 5, s: 0, am: 0, as: 0, bm: 0, bs: 0 }];
}
if (ops.length === 0) ops = [{ id: 0, n: 'Opció A', m: 5, s: 0, am: 0, as: 0, bm: 0, bs: 0 }];
ops.forEach(function (o, k) { if (typeof o.id !== 'number') o.id = k; });
let segId = carrega('segId', null);
const maxId = ops.reduce(function (m, o) { return Math.max(m, o.id); }, -1);
if (segId === null || segId <= maxId) segId = maxId + 1;
function nouId() { const x = segId++; guarda('segId', segId); return x; }

const selectes = [];
function omple(sel, v) {
  if (isNaN(v)) v = -1;
  sel.innerHTML = '';
  const ph = document.createElement('option');
  ph.value = '-1'; ph.textContent = 'Tria opció';
  sel.appendChild(ph);
  ops.forEach(function (o) {
    const op = document.createElement('option');
    op.value = String(o.id);
    op.textContent = (o.id === v) ? o.n : o.n + ' (' + fmt(o.m * 60 + o.s) + ')';
    sel.appendChild(op);
  });
  sel.value = String(v);
  if (sel.value !== String(v)) sel.value = '-1';
}
function refrescaSelectes() { selectes.forEach(function (sel) { omple(sel, parseInt(sel.value)); }); }

/* Botó i panell de configuració */
const cap = document.createElement('div');
cap.className = 'cap';
const tit = document.createElement('h1');
tit.textContent = 'Temporitzadors';
cap.appendChild(tit);
const versio = document.createElement('span');
versio.textContent = 'v' + APP_VERSION;
versio.className = 'versio';
cap.appendChild(versio);
const cfg = document.createElement('button');
cfg.className = 'sec';
cfg.textContent = 'Configura opcions';
cap.appendChild(cfg);
document.body.appendChild(cap);

const vel = document.createElement('div');
vel.className = 'vel';
const pan = document.createElement('div');
pan.className = 'pan';
pan.innerHTML = '<h2>Opcions</h2><div class="llista"></div><button class="sec afegeix">Afegeix opció</button><div class="peu"><button class="sec cancela">Cancel·la</button><button class="desa">Desa</button></div>';
vel.appendChild(pan);
document.body.appendChild(vel);
const llista = pan.querySelector('.llista');
let files = [];
function campTemps(segons) {
  const caixa = document.createElement('div'); caixa.className = 'camp-temps';
  const min = document.createElement('input'); min.type='text'; min.inputMode='numeric'; min.maxLength=3; min.setAttribute('aria-label','Minuts');
  const sep = document.createElement('span'); sep.textContent=':';
  const sec = document.createElement('input'); sec.type='text'; sec.inputMode='numeric'; sec.maxLength=2; sec.setAttribute('aria-label','Segons');
  min.value=String(Math.floor(segons/60)).padStart(2,'0'); sec.value=String(segons%60).padStart(2,'0');
  // Dos dígits de minuts fan avançar automàticament als segons.
  min.addEventListener('focus',function(){min.select();});
  sec.addEventListener('focus',function(){sec.select();});
  min.addEventListener('input',function(){
    min.value=min.value.replace(/\D/g,'').slice(0,3);
    if(min.value.length>=2 && Number(min.value)<=99){sec.focus();}
  });
  sec.addEventListener('input',function(){sec.value=sec.value.replace(/\D/g,'').slice(0,2);});
  min.addEventListener('blur',function(){min.value=String(Math.min(999,Number(min.value)||0)).padStart(2,'0');});
  sec.addEventListener('blur',function(){sec.value=String(Math.min(59,Number(sec.value)||0)).padStart(2,'0');});
  caixa.append(min,sep,sec);
  return {caixa,min,sec, valor:function(){return Math.min(999,Number(min.value)||0)*60+Math.min(59,Number(sec.value)||0);}};
}
function afegeixFila(o) {
  const f=document.createElement('div'); f.className='fp';
  const cap=document.createElement('div'); cap.className='fila-cap';
  const nm=document.createElement('input'); nm.type='text'; nm.className='nm'; nm.maxLength=24; nm.placeholder='Nom de l’opció'; nm.value=o.n;
  const del=document.createElement('button'); del.className='sec elim'; del.textContent='×'; del.setAttribute('aria-label','Elimina l’opció');
  cap.append(nm,del); f.appendChild(cap);
  function linia(nom,valor){
    const r=document.createElement('div'); r.className='temps-config';
    const label=document.createElement('label'); label.textContent=nom;
    const camp=campTemps(valor); r.append(label,camp.caixa); f.appendChild(r); return camp;
  }
  const durada=linia('Temps total',Number(o.m||0)*60+Number(o.s||0));
  const avis1=linia('1r avís',Number(o.am||0)*60+Number(o.as||0));
  const avis2=linia('2n avís',Number(o.bm||0)*60+Number(o.bs||0));
  const fila={id:o.id,nm,durada,avis1,avis2,del};
  del.onclick=function(){if(files.length<=1)return;f.remove();files=files.filter(x=>x!==fila);actualitzaEliminacio();};
  llista.appendChild(f); files.push(fila); actualitzaEliminacio(); return fila;
}
function actualitzaEliminacio() {
  files.forEach(function(f){f.del.disabled=files.length<=1;f.del.style.opacity=files.length<=1?'0.25':'1';f.del.setAttribute('aria-label',files.length<=1?'No es pot eliminar l’única opció':'Elimina l’opció');});
}
function obre() {
  llista.innerHTML = '';
  files = [];
  ops.forEach(afegeixFila);
  actualitzaEliminacio();
  vel.classList.add('obert');
}
function tanca() { vel.classList.remove('obert'); }
cfg.onclick = obre;
pan.querySelector('.afegeix').onclick = function () {
  const fila = afegeixFila({ id: nouId(), n: '', m: 1, s: 0 });
  fila.nm.focus();
};
pan.querySelector('.cancela').onclick = tanca;
vel.onclick = function (e) { if (e.target === vel) tanca(); };
pan.querySelector('.desa').onclick = function () {
  if (files.length === 0) return;
  ops = files.map(function (f, k) {
    const t=f.durada.valor(), a=f.avis1.valor(), b=f.avis2.valor();
    return {id:f.id,n:f.nm.value.trim()||('Opció '+(k+1)),
      m:Math.floor(t/60),s:t%60,am:Math.floor(a/60),as:a%60,bm:Math.floor(b/60),bs:b%60};
  });
  guarda('ops', ops);
  refrescaSelectes();
  document.dispatchEvent(new Event('opcionsActualitzades'));
  tanca();
};

/* Els sis temporitzadors */
for (let i = 0; i < N; i++) {
  let total = carrega('u' + i, null);
  if (total === null) { const g = carrega('t' + i, { m: 5, s: 0 }); total = g.m * 60 + g.s; }
  let resta = total, fins = null, id = null, al = null;
  let avisSeg = [0,0];
  let avisFet = [false,false];
  const d = document.createElement('div');
  d.className = 't';
  d.innerHTML =
    
    '<div class="zona"><select class="op"></select><div class="baix"><div class="ajust"><button class="mini men" aria-label="Baixa el temps">−</button><button class="mini mes" aria-label="Puja el temps">+</button></div><div class="temps">' + fmt(total) + '</div></div></div>' +
    '<div class="botons"><button class="go">Inicia</button><button class="sec rs">Reinicia</button></div>';
  document.body.appendChild(d);
  const pant = d.querySelector('.temps'), go = d.querySelector('.go'), rs = d.querySelector('.rs');
  const sel = d.querySelector('.op');
  selectes.push(sel);
  let q = carrega('q' + i, null);
  if (q === null) q = carrega('p' + i, -1);
  omple(sel, q);
  function actualitzaAvis() { const o = ops.find(function (x) { return x.id === parseInt(sel.value); }); avisSeg = o ? [Number(o.am||0)*60+Number(o.as||0),Number(o.bm||0)*60+Number(o.bs||0)] : [0,0]; }
  actualitzaAvis();
  document.addEventListener('opcionsActualitzades', function () { actualitzaAvis(); if (!id) avisFet = [false,false]; });
  function pinta() { pant.textContent = fmt(resta); }
  function atura() { clearInterval(id); id = null; fins = null; go.textContent = 'Inicia'; }
  function paraAlarma() { clearInterval(al); al = null; d.classList.remove('fi'); }
  function tic() {
    resta = Math.max(0, Math.ceil((fins - Date.now()) / 1000));
    pinta();
    avisSeg.forEach(function(seg,j){
      if (!avisFet[j] && seg>0 && total>seg && total-resta>=seg && resta>0) {
        avisFet[j]=true; piuIntermedi(j + 1);
      }
    });
    if (resta === 0) { atura(); d.classList.add('fi'); go.textContent = 'Atura'; piu(); clearInterval(al); al = setInterval(piu, 700); }
  }
  function ajusta(delta) {
    if (al) { paraAlarma(); go.textContent = 'Inicia'; }
    if (id) {
      fins = Math.max(Date.now() + 1000, fins + delta * 1000);
      resta = Math.max(1, Math.ceil((fins - Date.now()) / 1000));
      pinta();
      return;
    }
    if (resta === 0) { resta = total; avisFet = [false,false]; }
    resta = Math.min(86400, Math.max(0, resta + delta));
    if (go.textContent === 'Inicia') { total = resta; guarda('u' + i, total); }
    pinta();
  }
  function repeteix(boto, signe) {
    let t1 = null, t2 = null, n = 0;
    function para() { clearTimeout(t1); clearInterval(t2); }
    function pas() { return n < 8 ? 5 : (n < 20 ? 30 : 60); }
    boto.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      para(); n = 0;
      ajusta(signe * pas());
      t1 = setTimeout(function () { t2 = setInterval(function () { n++; ajusta(signe * pas()); }, 120); }, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { boto.addEventListener(ev, para); });
  }
  repeteix(d.querySelector('.men'), -1);
  repeteix(d.querySelector('.mes'), 1);
  go.onclick = function () {
    llegirAudio();
    if (al) { paraAlarma(); go.textContent = 'Inicia'; return; }
    d.classList.remove('fi');
    if (id) { atura(); go.textContent = 'Continua'; return; }
    if (resta === 0) { resta = total; avisFet = [false,false]; pinta(); }
    if (resta === 0) return;
    fins = Date.now() + resta * 1000;
    id = setInterval(tic, 250);
    go.textContent = 'Pausa';
  };
  rs.onclick = function () { paraAlarma(); atura(); resta = total; avisFet = [false,false]; pinta(); };
  sel.onchange = function () {
    const k = parseInt(sel.value);
    guarda('q' + i, k);
    omple(sel, k);
    const o = ops.find(function (x) { return x.id === k; });
    if (!o) return;
    paraAlarma(); atura();
    total = resta = o.m * 60 + o.s;
    avisFet = [false,false];
    actualitzaAvis();
    guarda('u' + i, total);
    pinta();
  };
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}







</script>
</body>
</html>
